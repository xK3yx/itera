services:
  api:
    build: .
    container_name: itera_api
    ports:
      - "8000:8000"
    environment:
      # Docker service hostnames override the localhost values in .env
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - CHROMA_PATH=/app/chroma_data
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-1440}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - chroma_data:/app/chroma_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itera_network

  frontend:
    build: ../itera-frontend
    container_name: itera_frontend
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - itera_network

  db:
    image: postgres:15-alpine
    container_name: itera_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to localhost only, so the database is not reachable from the network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - itera_network

volumes:
  postgres_data:
  chroma_data:

networks:
  itera_network:
    driver: bridge